<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla 승인</title>
</head>
<body>
<p id="msg">승인 결과를 집 서버로 보내는 중입니다. 폰은 집 Wi-Fi에 연결되어 있어야 합니다.</p>
<script>
const params = new URLSearchParams(location.search);
const code = params.get("code") || "";
const state = params.get("state") || "";
const error = params.get("error") || "";
const msg = document.getElementById("msg");
if (!code && !error) {
  msg.textContent = "승인 코드가 없습니다. Tesla 로그인 화면에서 시작해 주세요.";
} else {
  const dest = new URL("http://192.168.1.244:8787/tesla/callback");
  if (code) dest.searchParams.set("code", code);
  if (state) dest.searchParams.set("state", state);
  if (error) dest.searchParams.set("error", error);
  history.replaceState({}, "", location.pathname);
  location.replace(dest.toString());
}
</script>
</body>
</html>
